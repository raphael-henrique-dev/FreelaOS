version: '3.8'

services:
  freelaos-backend:
    build: .
    container_name: freelaos-backend
    ports:
      - "80:8000"
    volumes:
      - playwright_data:/app/playwright_sessions
    env_file:
      - .env
    security_opt:
      - seccomp:unconfined
    ipc: host
    deploy:
      resources:
        limits:
          memory: 1.5G
          pids: 4096
    restart: unless-stopped

volumes:
  playwright_data:
